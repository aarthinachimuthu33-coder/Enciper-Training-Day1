<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOCUMENT</title>

<style>
body{
    font-family:Arial, sans-serif;
}
.row{
    display:flex;
    margin-bottom:40px;
}
.row div{
    background:teal;
    color:white;
    padding:20px;
    margin:5px;
}
.column{
    display:flex;
    flex-direction:column;
    margin-bottom:40px;
}
.column div{
    background:blue;
    color:white;
    padding:20px;
    margin:5px;
}
.wrap{
    display:flex;
    flex-wrap:wrap;
    margin-bottom:40px;
}
.wrap div{
    background:green;
    color:white;
    padding:30px;
    margin:5px;
    width:120px;
}
.center{
    display:flex;
    justify-content:center;
    margin-bottom:40px;
}
.center div{
    background:red;
    color:white;
    padding:20px;
    margin:5px;
}
.space{
    display:flex;
    justify-content:space-between;
    margin-bottom:40px;
}
.space div{
    background:purple;
    color:white;
    padding:20px;
}
.vertical{
    display:flex;
    align-items:center;
    height:200px;
    margin-bottom:40px;
}
.vertical div{
    background:orange;
    color:white;
    margin:5px;
    padding:10px;
}
</style>
</head>

<body>

<h2>1. Row</h2>
<div class="row">
    <div>Box 1</div>
    <div>Box 2</div>
    <div>Box 3</div>
</div>

<h2>2. Column</h2>
<div class="column">
    <div>Box 1</div>
    <div>Box 2</div>
    <div>Box 3</div>
    <div>Box 4</div>
</div>

<h2>3. Wrap</h2>
<div class="wrap">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>
</div>

<h2>4. Center</h2>
<div class="center">
    <div>A</div>
    <div>B</div>
    <div>C</div>
</div>

<h2>5. Space Between</h2>
<div class="space">
    <div>Left</div>
    <div>Middle</div>
    <div>Right</div>
</div>

<h2>6. Vertical Center</h2>
<div class="vertical">
    <div style="height:50px;">Small</div>
    <div style="height:100px;">Medium</div>
    <div style="height:150px;">Large</div>
</div>

<h2>7. Visibility Hidden</h2>
<button style="visibility:hidden;">Hidden Button</button>
<button>Visible Button</button>

<h2>8. Inline </h2>
<div style="background:black;color:white;padding:20px;margin-top:10px;">
WELCOME
</div>

<h2>9. Span Block</h2>
<span style="display:block;background:cyan;margin:5px;padding:10px;">1</span>
<span style="display:block;background:cyan;margin:5px;padding:10px;">2</span>

</body>
</html>
